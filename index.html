<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16324f" />
    <title>World is Mine</title>
  </head>
  <body>
    <header class="bar">
      <h1>World is Mine</h1>
      <div class="counts" aria-label="進捗">
        <span class="count"><i class="dot gold"></i><b id="count-gold">0</b></span>
        <span class="count"><i class="dot red"></i><b id="count-red">0</b></span>
        <span class="count total">/ <span id="count-total">197</span></span>
      </div>
    </header>

    <main class="stage">
      <svg id="map" role="img" aria-label="世界地図"></svg>
      <button id="world-btn" class="map-btn" type="button" aria-label="世界全体を表示">🌐</button>
    </main>

    <section class="panel">
      <div class="question">
        <p id="prompt" class="prompt">読み込み中…</p>
        <div id="hints" class="hints" hidden>
          <img id="hint-flag" class="flag" alt="国旗" hidden />
          <span id="hint-capital" class="capital" hidden></span>
        </div>
      </div>
      <div id="choices" class="choices"></div>
      <div class="actions">
        <button id="hint-btn" class="action hint" type="button">ヒント</button>
        <button id="next-btn" class="action next" type="button" hidden>次の問題へ</button>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
